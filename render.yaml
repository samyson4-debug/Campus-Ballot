# ==============================================================================
# Campus Ballot — Render Blueprint Specification
# Deploys Web Service + Managed PostgreSQL Database on Render (Free Tier)
# ==============================================================================

databases:
  - name: campus-ballot-db
    databaseName: campus_ballot
    user: campus_user
    plan: free

services:
  - type: web
    name: campus-ballot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-ballot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # Must be filled securely in Render Dashboard or prompts on deploy
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "8"
      - key: PBKDF2_ITERATIONS
        value: "100000"

